apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true

  # Powers the Alert/Incident/Jenkins dashboards, which query application
  # tables (alerts, incidents, jenkins_metrics) directly rather than metrics.
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: aiops_db
    user: postgres
    secureJsonData:
      password: password
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    editable: true
