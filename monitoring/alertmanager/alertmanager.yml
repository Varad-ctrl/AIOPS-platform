global:
  resolve_timeout: 5m

route:
  receiver: "aiops-backend-webhook"
  group_by: ["alertname", "instance"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 3h

receivers:
  - name: "aiops-backend-webhook"
    webhook_configs:
      - url: "http://backend:8000/api/v1/alerts/webhook"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "instance"]
